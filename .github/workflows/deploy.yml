name: Deploy DC Translation Bot to GCP

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: journeylink-498811
  REGION: europe-west1
  GAR_REPOSITORY: journeylink-repo
  SERVICE_NAME: dc-translation-bot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install & Test Build
        run: |
          npm ci
          npm run build

      - name: Google Cloud Authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Docker Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}"
          docker build -t "$IMAGE_TAG:${{ github.sha }}" -t "$IMAGE_TAG:latest" .
          docker push "$IMAGE_TAG:${{ github.sha }}"
          docker push "$IMAGE_TAG:latest"

      - name: Deploy to Always-Free VM (dc-translation-vm)
        run: |
          gcloud compute ssh dc-translation-vm --zone=us-east1-b --project=${{ env.PROJECT_ID }} --command="docker inspect dc-translation-bot --format '{{range .Config.Env}}{{println .}}{{end}}' > ~/bot.env && docker pull ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:latest && docker stop dc-translation-bot && docker rm dc-translation-bot && docker run -d --name dc-translation-bot --restart always --env-file ~/bot.env ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:latest && rm -f ~/bot.env"

