name: CI & Deploy Bot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'dc-translation' }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME || 'dc-translation-bot' }}
  VM_NAME: ${{ vars.GCP_VM_NAME || 'dc-translation-vm' }}
  VM_ZONE: ${{ vars.GCP_VM_ZONE || 'us-east1-b' }}

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install, Typecheck & Build
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Google Cloud Authentication
        if: ${{ github.event_name == 'push' && secrets.GCP_SA_KEY != '' && vars.GCP_PROJECT_ID != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        if: ${{ github.event_name == 'push' && secrets.GCP_SA_KEY != '' && vars.GCP_PROJECT_ID != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: ${{ github.event_name == 'push' && secrets.GCP_SA_KEY != '' && vars.GCP_PROJECT_ID != '' }}
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Docker Image
        if: ${{ github.event_name == 'push' && secrets.GCP_SA_KEY != '' && vars.GCP_PROJECT_ID != '' }}
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}"
          docker build -t "$IMAGE_TAG:${{ github.sha }}" -t "$IMAGE_TAG:latest" .
          docker push "$IMAGE_TAG:${{ github.sha }}"
          docker push "$IMAGE_TAG:latest"

      - name: Deploy to GCP Compute Engine VM
        if: ${{ github.event_name == 'push' && secrets.GCP_SA_KEY != '' && vars.GCP_PROJECT_ID != '' }}
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} --zone=${{ env.VM_ZONE }} --project=${{ env.PROJECT_ID }} --command="set -e; umask 077; trap 'rm -f ~/bot.env' EXIT; docker inspect ${{ env.SERVICE_NAME }} --format '{{range .Config.Env}}{{println .}}{{end}}' > ~/bot.env && docker pull ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:latest && docker stop ${{ env.SERVICE_NAME }} && docker rm ${{ env.SERVICE_NAME }} && docker run -d --name ${{ env.SERVICE_NAME }} --restart always --env-file ~/bot.env ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:latest"

