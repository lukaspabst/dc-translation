services:
  redis:
    image: redis:7-alpine
    container_name: dc-translation-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: sh -c 'exec redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 256M

  discord-bot:
    build: .
    container_name: dc-translation-bot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - ./data.db:/app/data.db
      - ./data.db-wal:/app/data.db-wal
      - ./data.db-shm:/app/data.db-shm
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  redis-data:
